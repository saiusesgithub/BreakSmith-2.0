rules:
  - id: breaksmith.python.sql-string-format
    message: User-controlled data is interpolated into a SQL query. Use bound parameters.
    severity: ERROR
    languages: [python]
    metadata:
      title: Potential SQL injection
    patterns:
      - pattern: $CURSOR.execute($QUERY, ...)
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-either:
                - pattern: $PREFIX + $VALUE
                - pattern: $STRING % $VALUE
                - pattern: $STRING.format(...)
                - pattern: f"..."
  - id: breaksmith.python.shell-true
    message: A shell command is built from dynamic input. Avoid shell=True and pass a fixed argument list.
    severity: ERROR
    languages: [python]
    metadata:
      title: Potential command injection
    pattern-either:
      - pattern: subprocess.run($CMD, shell=True, ...)
      - pattern: subprocess.call($CMD, shell=True, ...)
      - pattern: subprocess.check_output($CMD, shell=True, ...)
      - pattern: os.system($CMD)
  - id: breaksmith.python.hardcoded-secret
    message: A credential appears to be hardcoded. Load it from an environment variable or secret store.
    severity: WARNING
    languages: [python]
    metadata:
      title: Hardcoded credential
    patterns:
      - pattern-either:
          - pattern: PASSWORD = "..."
          - pattern: API_KEY = "..."
          - pattern: SECRET_KEY = "..."
      - pattern-not: PASSWORD = ""
      - pattern-not: API_KEY = ""
      - pattern-not: SECRET_KEY = ""
